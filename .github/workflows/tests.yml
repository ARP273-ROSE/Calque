name: tests

# À chaque push : tests sous Linux (vrais disques image GPT/MBR, interface hors
# écran) et sous Windows, dont un clonage À CHAUD réel entre deux VHDX avec
# cliché VSS. La publication est faite par release.yml (gabarit du kit).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Outils de fabrication des disques d'essai, bibliothèques Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdisk ntfs-3g dosfstools fdisk libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests
        env: {QT_QPA_PLATFORM: offscreen}
        run: python -m pytest -q tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests (dont clonage réel VHDX + VSS)
        env:
          QT_QPA_PLATFORM: offscreen
          CALQUE_ESSAI_VHD: "1"
        run: python -m pytest -q -rs tests
